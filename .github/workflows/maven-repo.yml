---
# Publishes BehemironJoltJNI artifacts to the `maven-repo` branch (consumed by the engine
# builds as a git-based Maven repository) and attaches jars to GitHub Releases.
#
# Flow mirrors BehemironText: per-platform native builds -> mvn deploy-file staging into a
# Maven repository layout -> append-commit onto the maven-repo branch -> release assets.
#
# Platform jobs build the upstream Gradle targets and upload the natives jar; the deploy job
# re-stages them under OUR classifier convention (windows-x86_64 / linux-x86_64 /
# macosx-x86_64 / macosx-arm64 / android), which differs from upstream's ReleaseSp-style
# classifiers. The android job drives upstream's android.gradle (AGP + ndk-build) and
# stages the multi-ABI AAR as classifier `android` (packaging aar).

name: Publish maven-repo
on:
  push:
    branches: [behemiron]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

env:
  MAVEN_REPO_BRANCH: maven-repo

jobs:
  base:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Java + Linux x64 natives
        run: ./gradlew -Pbt=Release -Pflavor=Sp -Ptarget=Linux64 assemble --console=plain
        shell: bash
      - name: Upload base jar and linux natives
        uses: actions/upload-artifact@v4
        with:
          name: maven-base
          path: build/libs/*.jar
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pbt=Release -Pflavor=Sp -Ptarget=Windows64 assemble --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: maven-windows-x86_64
          path: build/libs/*-ReleaseSp.jar
          if-no-files-found: error

  macosx-x86_64:
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pbt=Release -Pflavor=Sp -Ptarget=MacOSX64 assemble --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: maven-macosx-x86_64
          path: build/libs/*-ReleaseSp.jar
          if-no-files-found: error

  macosx-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -Pbt=Release -Pflavor=Sp -Ptarget=MacOSX_ARM64 assemble --console=plain
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: maven-macosx-arm64
          path: build/libs/*-ReleaseSp.jar
          if-no-files-found: error

  android:
    # Mirrors upstream's Java21-x-Android job: JDK 21, prepare the unpacked Jolt sources
    # with the default build file, then replace build.gradle with android.gradle and run
    # AGP. `-b android.gradle` does not work with AGP (the plugin needs the standard build
    # file). setup-android accepts the SDK licenses and installs the pinned NDK.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;30.0.16248370'
          accept-android-sdk-licenses: true
      - name: Prepare native sources
        run: ./gradlew classes unpackJoltSource unpackTestFramework unpackVhacdSource --console=plain
        shell: bash
      - name: Build Android AAR
        run: |
          cp android.gradle build.gradle
          ./gradlew -Partifact=behemiron-jolt-jni-Android -Pflavor=Sp assembleRelease --console=plain
        shell: bash
      - name: Repackage per-ABI runtime natives jars
        # FCL/Pojav run the full Java Edition JVM on Android, so the consumer of these is a
        # JVM classpath (our Loader extracts by resource path), not an Android app module.
        # Crack the AAR and lay each ABI's libjoltjni.so out like the desktop natives jars:
        #   android/<abi>/com/github/stephengold/libjoltjni.so
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^jjVersion = \(.*\)/\1/p' gradle.properties | head -n 1)"
          aar="$(find build/outputs/aar -name '*.aar' | head -n 1)"
          rm -rf aar-out repack && mkdir -p aar-out repack
          unzip -q "$aar" -d aar-out
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="aar-out/jni/${abi}/libjoltjni.so"
            [[ -f "$so" ]] || continue
            staging="repack/${abi}/android/${abi}/com/github/stephengold"
            mkdir -p "$staging"
            cp "$so" "$staging/"
            (cd "repack/${abi}" && jar cf "../../behemiron-jolt-jni-${project_version}-android-${abi}.jar" .)
          done
          ls -la behemiron-jolt-jni-*.jar
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: maven-android
          path: |
            build/outputs/aar/*.aar
            behemiron-jolt-jni-*-android-*.jar
          if-no-files-found: error

  deploy-maven-repo:
    needs: [base, windows-x86_64, macosx-x86_64, macosx-arm64, android]
    if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download all Maven artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maven-*
          merge-multiple: true
          path: prebuilt-artifacts

      - name: Resolve project version
        id: project-version
        run: |
          project_version="$(sed -n 's/^jjVersion = \(.*\)/\1/p' gradle.properties | head -n 1)"
          echo "version=${project_version}" >> "$GITHUB_OUTPUT"

      - name: Stage artifacts into Maven repository layout
        run: |
          set -euo pipefail
          project_version="${{ steps.project-version.outputs.version }}"
          repo_out="${PWD}/repo-out"
          mkdir -p "$repo_out"
          deploy_file_args=(
            org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file
            -B
            -Durl="file://${repo_out}"
            -DgroupId=com.behemiron.engine
            -DartifactId=behemiron-jolt-jni
            -Dversion="${project_version}"
            -Dpackaging=jar
            -DgeneratePom=true
          )

          # Base jar (Java classes + no classifier): from the base job, the jar WITHOUT
          # the ReleaseSp classifier.
          base_jar="$(find prebuilt-artifacts -name "behemiron-jolt-jni-${project_version}.jar" | head -n 1)"
          if [[ ! -f "$base_jar" ]]; then
            echo "Base jar not found for version ${project_version}"
            find prebuilt-artifacts -type f | sort
            exit 1
          fi
          mvn "${deploy_file_args[@]}" -Dfile="$base_jar"

          # Platform natives under our classifier convention. Each platform job uploads
          # its ReleaseSp natives jar; the base job's copy is the Linux build (skip it,
          # linux-x86_64 comes from the base job's second jar — handled by name below).
          for entry in "maven-windows-x86_64:windows-x86_64" "maven-macosx-x86_64:macosx-x86_64" "maven-macosx-arm64:macosx-arm64"; do
            artifact_dir="${entry%%:*}"
            classifier="${entry##*:}"
            jar="$(find "prebuilt-artifacts" -path "*${artifact_dir}*" -name '*-ReleaseSp.jar' | head -n 1)"
            if [[ ! -f "$jar" ]]; then
              echo "Natives jar not found for ${classifier} (dir ${artifact_dir})"
              find prebuilt-artifacts -type f | sort
              exit 1
            fi
            mvn "${deploy_file_args[@]}" -Dfile="$jar" -Dclassifier="${classifier}"
          done

          # Linux x64 natives: the ReleaseSp jar from the base job.
          linux_jar="$(find prebuilt-artifacts -path '*maven-base*' -name '*-ReleaseSp.jar' | head -n 1)"
          mvn "${deploy_file_args[@]}" -Dfile="$linux_jar" -Dclassifier=linux-x86_64

          # Android: multi-ABI AAR (classifier `android`, packaging aar) for app-module
          # consumers, plus per-ABI runtime natives jars (classifier android-<abi>) for the
          # JVM classpath path (FCL/Pojav).
          aar="$(find prebuilt-artifacts -path '*maven-android*' -name '*.aar' | head -n 1)"
          if [[ ! -f "$aar" ]]; then
            echo "Android AAR not found"
            find prebuilt-artifacts -type f | sort
            exit 1
          fi
          mvn "${deploy_file_args[@]}" -Dfile="$aar" -Dclassifier=android -Dpackaging=aar
          for abi_jar in $(find prebuilt-artifacts -path '*maven-android*' -name '*-android-*.jar' | sort); do
            abi_classifier="$(basename "$abi_jar" | sed -E "s/behemiron-jolt-jni-${project_version}-android-(.*)\.jar/\1/")"
            mvn "${deploy_file_args[@]}" -Dfile="$abi_jar" -Dclassifier="android-${abi_classifier}"
          done

          echo "Staged Maven repository layout:"
          (cd "$repo_out" && find . -type f | sort)

      - name: Push maven-repo branch (append)
        run: |
          set -euo pipefail
          project_version="${{ steps.project-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin "$MAVEN_REPO_BRANCH"; then
            git worktree add --detach repo-branch "origin/${MAVEN_REPO_BRANCH}"
            cp -a repo-out/. repo-branch/
            git -C repo-branch add -A
            git -C repo-branch diff --cached --quiet || \
              git -C repo-branch commit -m "deploy: behemiron-jolt-jni ${project_version} (maven-repo append)"
            git -C repo-branch push origin "HEAD:${MAVEN_REPO_BRANCH}"
          else
            git worktree add --detach repo-branch
            git -C repo-branch checkout --orphan "$MAVEN_REPO_BRANCH"
            git -C repo-branch rm -rf -- . >/dev/null
            cp -a repo-out/. repo-branch/
            git -C repo-branch add -A
            git -C repo-branch commit -m "deploy: initialize ${MAVEN_REPO_BRANCH} with behemiron-jolt-jni ${project_version}"
            git -C repo-branch push origin "HEAD:${MAVEN_REPO_BRANCH}"
          fi

      - name: Attach jars to GitHub Release assets
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find prebuilt-artifacts -type f \( -name '*.jar' -o -name '*.aar' \) -exec \
            gh release upload "${{ github.event.release.tag_name }}" {} \
              --repo "${{ github.repository }}" \
              --clobber \;
